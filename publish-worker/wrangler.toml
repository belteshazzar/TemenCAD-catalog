name = "temencad-publish"
main = "worker.js"
compatibility_date = "2025-01-01"

# Secrets (set with `wrangler secret put <NAME>`):
#   GITHUB_TOKEN      classic token for the bot account with the public_repo scope (fine-grained tokens cannot open
#                     pull requests on repositories the bot does not own)
#   TURNSTILE_SECRET  Cloudflare Turnstile secret, pairs with TURNSTILE_SITE_KEY in the app (optional)
[vars]
CATALOG_REPO = "belteshazzar/TemenCAD-catalog"   # where pull requests are opened
FORK_REPO = "temen-bot/TemenCAD-catalog"      # the bot's fork that branches are pushed to
ALLOWED_ORIGIN = "https://belteshazzar.github.io"
MAX_BYTES = "2097152"
